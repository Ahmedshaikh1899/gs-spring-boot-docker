name: Java CI with Maven

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: ./complete
        run: mvn clean package

      - name: Copy JAR
        run: |
          mkdir -p complete/build-artifact
          cp complete/target/*.jar complete/build-artifact/

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add complete/build-artifact/
          git commit -m "Add Maven build artifact" || echo "No changes to commit"
          git push
